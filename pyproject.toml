[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nldate"
version = "0.1.0"
description = "Natural language date parser"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "types-python-dateutil>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nldate"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
